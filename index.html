<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulário</title>
</head>
<body>
    <form action="#" method="post">

        <fieldset>
        <input type="text" id="nome" name="nome" placeholder="digite seu nome" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="exemplo@email.com"required>

        <label for="senha">crie uma senha:</label>
        <input type="password" id="senha" name="senha" minlegth="6" maxlength="12" required>

        <label FOR="nascimento">Data de nascimento:</label>
        <input type="password" id="nascimento" name="nascimento" required>

        <h2>contado e localização </h2>

        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" name="cidade" required>

        <label for="estado">Estado:</label>
        <select id="estado" name="estado" required>
         <opition value="">selecione...</opition>
         <option value="SC">Santa catarina</option>
         <option value="PR">paraná</option>
         <opition value="RS"> Rio Grande do Sul </opition>
         </select>

         <h2>PreterÊncias de serviço </h2>

         <p>Deseja receber novidades por e-mail?</p>
         <input type="radio" id="sim" name="novidades" value="sim" required>
         <label for="nao">Não</label>

         <p>Selecione os serviços de interesse:</p>
         <input type="checkbox" id="web" name="servicos" value="web">
         <label for="web">Desenvolvimento web</label>

         <input type="checkbox" id="design" name="servicos" value="design">
         <label for="design">Design Digital</label>

         <input type="checkbox" id="redes" name="servicos" value="redes">
         <label for="redes">Redes de Computadores</label>
        </fieldset>
    <br>
         <legend>Comentários </legend>
         <label for="mensagem">Deixe uma mensagem (opcional):</label><br>
         <textarea id="mensagem" name="mensagem" rows="14" cols="50" placeholder="Digite suas observações..."></textarea>
         <br>

         <button type="submit">Enviar Cadastro</button>
         <button type="reset">Limpar</button>
         </form>
        
</body>
</html>
